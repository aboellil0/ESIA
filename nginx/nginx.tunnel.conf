events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Prefer Cloudflare's X-Forwarded-Proto (https), fall back to origin scheme.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  # CLOUDFLARE TUNNEL origin - reached only via cloudflared (plus LAN on :80).
  # TLS terminates at Cloudflare's edge; origin traffic stays HTTP inside docker.
  server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # API - backend
    location /api/ {
      proxy_pass http://backend:5000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Cloudflare already sets X-Forwarded-Proto (https); keep the chain.
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
      proxy_read_timeout 60s;
    }

    location /uploads/ {
      proxy_pass http://backend:5000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    # React Vite frontend on 3000 (serve)
    location / {
      proxy_pass http://frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
