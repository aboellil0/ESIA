events {
 worker_connections 1024;
}

http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;

 sendfile on;
 keepalive_timeout 65;

 gzip on;
 gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

 # HTTP - ACME challenge + redirect
 server {
 listen 80;
 server_name esia.local localhost;

 location /.well-known/acme-challenge/ {
 root /var/www/certbot;
 }

 location / {
 return 301 https://$host$request_uri;
 }
 }

 # HTTPS
 server {
 listen 443 ssl;
 server_name esia.local localhost;

 ssl_certificate /etc/letsencrypt/live/esia.local/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/esia.local/privkey.pem;

 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_ciphers HIGH:!aNULL:!MD5;
 ssl_prefer_server_ciphers on;

 client_max_body_size 10m;

 add_header X-Frame-Options "SAMEORIGIN" always;
 add_header X-Content-Type-Options "nosniff" always;
 add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

 location /api/ {
 proxy_pass http://backend:5000;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_read_timeout 60s;
 }

 location /uploads/ {
 proxy_pass http://backend:5000;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 expires 30d;
 add_header Cache-Control "public, immutable";
 }

 # React Vite frontend on 3000 (serve), like Next on 3000 in 
 location / {
 proxy_pass http://frontend:3000;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 }
 }
}